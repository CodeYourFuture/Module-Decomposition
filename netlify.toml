# Netlify hosts the FRONTEND ONLY.
# The Socket.IO backend needs a long-lived Node process and must be deployed
# elsewhere (Render, Railway, Fly.io); Netlify has no WebSocket support.

[build]
  publish = "chat-app/front-end"
  # Set BACKEND_URL in Site configuration > Environment variables.
  command = "node scripts/inject-backend-url.mjs"

# config.js carries the backend URL and is regenerated on every build, so it
# must never be served stale. app.js is small and changes often enough that
# skipping the cache costs nothing.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

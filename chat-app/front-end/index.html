<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Chat</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- Frontend is hosted on Netlify, separately from the backend, so the
         Socket.IO client comes from the CDN. Keep this version in step with
         the "socket.io" version in back-end/package.json. -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" crossorigin="anonymous"></script>
    <!-- Written at build time from the BACKEND_URL env var; see scripts/inject-backend-url.mjs -->
    <script src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="chat-container">
      <h1>🌍 World Chat</h1>
      <div id="online-count">👥 0 online</div>
      <div id="welcome-user"></div>
      <div id="chats"></div>
      <form id="chat-form">
        <textarea id="chat" placeholder="Type your message..." maxlength="500" required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
